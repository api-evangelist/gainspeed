name: Gainspeed
description: Gainspeed, Inc. was a Sunnyvale, California networking startup that developed a
  Virtual Converged Cable Access Platform (Virtual CCAP) built on a Distributed Access Architecture
  (Remote PHY / DAA) for cable multiple-system operators (MSOs). The company was backed by
  Andreessen Horowitz (a16z) and was acquired by Nokia in 2016, after which its virtual CCAP
  technology was folded into Nokia's cable access portfolio. It was surfaced as an a16z portfolio
  company and added to the API Evangelist network as a stub. Gainspeed operated no public developer
  program, API, or live developer portal; its domain no longer resolves.
